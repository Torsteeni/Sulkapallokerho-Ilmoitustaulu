<!DOCTYPE HTML>
<html>
<head>
<title>Sulkapallokerho</title>
</head>
<body>
<h1>Sulkapallokerho</h1>	
 {% if session.username %}	
 <p/a>
 Olet kirjuatunut nimellä {{ session.username }}
  <a href="/logout">Kirjaudu ulos</a>
 </p>
 <hr />
 <h1>
	ilmoitukset: {{ count }}
 </h1>
 <hr />
 {% for message in messages %}
 <p>
 	{{ message.content }}
 </p>
<hr />
{% endfor %}
 {% else %}
<p>
 Et ole kirjautunut. Kirjaudu sisään <a href="/login">tästä</a>
 </p>
 <hr />
 {% endif %}
</body>
</html>
