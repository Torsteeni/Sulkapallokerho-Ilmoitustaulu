{% if query %}
    <hr />
    <h2>Tulokset:</h2>

    <ul>
    {% for result in results %}
        <li>
            <h3>
                <a href="/message/{{ result[0] }}">
                    {{ result[2] }}
                </a>
            </h3>

            <p><strong>Julkaisija:</strong> {{ result[4] }}</p>

            <p><strong>Tapahtumapäivä:</strong> {{ result[6] }}</p>

            <p><strong>Kellonaika:</strong> {{ result[7] }}</p>

            <p><strong>Julkaistu:</strong> {{ result[3] }}</p>

        </li>
        <br />
    {% endfor %}
    </ul>
{% endif %}

<a href="/">Takaisin etusivulle</a>
