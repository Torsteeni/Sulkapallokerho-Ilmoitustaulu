<!DOCTYPE HTML>
<html>
<head>
<title>Sulkapallokerho</title>
</head>
<body>
<h1>Uusi ilmoitus</h1>
<br />
<form action="/new_message" method="post">
    <p>Otsikko:</p>
    <input type="text" name="title" required>

    <br>

    <p>Ilmoituksen sisältö:</p>
    <textarea name="content" rows="5" required></textarea>

    <br>

    <input type="submit" value="Lähetä ilmoitus">

</form>
</body>
</html>
